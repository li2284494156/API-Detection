# DeepSeek API balance monitor.
#
# The Host half registers one read-only same-origin JSON route; the browser half
# (declared by dsh.client in package.json) renders the collapsible bottom-right
# widget. The API key is resolved from the credential store on every refresh, so
# a key changed in Settings takes effect without a restart.
- insert:
    - id: deepseek-balance
      name: 'dsh-deepseek-balance'
      config:
        refreshIntervalMs: 5000
        minIntervalMs: 2000
        historyLimit: 720
